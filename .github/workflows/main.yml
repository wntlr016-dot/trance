name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project.zip (if present)
        run: |
          if [ -f project.zip ]; then
            unzip -o project.zip -d .
          fi
          ls -la

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk jpsub.apk

      - uses: actions/upload-artifact@v4
        with:
          name: jpsub-apk
          path: jpsub.apk

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest jpsub.apk \
            --title "최신 빌드 (${GITHUB_SHA::7})" \
            --notes "폰에서 jpsub.apk 를 눌러 받아 설치하세요."
